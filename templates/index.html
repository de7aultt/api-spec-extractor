<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Spec Extractor Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0b0f17",
            panel: "#131a26",
            edge: "#1f2a3a",
            accent: "#38bdf8",
            accent2: "#a78bfa"
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-slate-200 font-sans min-h-screen">
  <header class="border-b border-edge bg-panel/60 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i data-lucide="radar" class="text-accent w-7 h-7"></i>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">API Spec Extractor</h1>
          <p class="text-xs text-slate-400">Target Radar &amp; OpenAPI Reconstruction Command Center</p>
        </div>
      </div>
      <nav class="flex gap-1 bg-surface/70 border border-edge rounded-lg p-1">
        <button data-tab="radar" class="tab-button px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2">
          <i data-lucide="crosshair" class="w-4 h-4"></i> Target Radar
        </button>
        <button data-tab="jobs" class="tab-button px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2">
          <i data-lucide="list-checks" class="w-4 h-4"></i> Scan Jobs
        </button>
        <button data-tab="spec" class="tab-button px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2">
          <i data-lucide="file-json" class="w-4 h-4"></i> Spec Viewer
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <section id="tab-radar" class="tab-panel">
      <div class="flex flex-col md:flex-row md:items-end gap-4 mb-6">
        <div class="flex-1">
          <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Search programs or domains</label>
          <input id="radar-search" type="text" placeholder="Name, handle, or domain (e.g. wolt, agoda, tiktok)"
            class="w-full bg-panel border border-edge rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/60" />
        </div>
        <div class="w-44">
          <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Min response (%)</label>
          <input id="radar-response" type="number" min="0" max="100" value="0" placeholder="0 - 100%"
            class="w-full bg-panel border border-edge rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/60" />
        </div>
        <button id="radar-search-btn"
          class="bg-accent text-surface font-semibold px-5 py-2.5 rounded-lg text-sm flex items-center gap-2 hover:brightness-110 transition">
          <i data-lucide="search" class="w-4 h-4"></i> Search
        </button>
        <button id="radar-refresh-btn"
          class="bg-panel border border-edge px-5 py-2.5 rounded-lg text-sm flex items-center gap-2 hover:border-accent/60 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh Feed
        </button>
      </div>
      <div id="radar-status" class="text-sm text-slate-400 mb-4">Loading active bounty programs...</div>
      <div id="radar-results" class="grid gap-4"></div>
    </section>

    <section id="tab-jobs" class="tab-panel hidden">
      <div class="bg-panel border border-edge rounded-xl p-5 mb-6">
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-2">Manual scan</label>
        <div class="flex gap-3">
          <input id="manual-url" type="text" placeholder="https://target.example.com"
            class="flex-1 bg-surface border border-edge rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/60" />
          <button id="manual-scan-btn"
            class="bg-accent2 text-surface font-semibold px-5 py-2.5 rounded-lg text-sm flex items-center gap-2 hover:brightness-110 transition">
            <i data-lucide="zap" class="w-4 h-4"></i> Scan API
          </button>
        </div>
        <p id="manual-status" class="text-xs text-slate-400 mt-2"></p>
      </div>
      <div id="jobs-list" class="grid gap-4"></div>
    </section>

    <section id="tab-spec" class="tab-panel hidden">
      <div id="spec-empty" class="text-sm text-slate-400">
        Select a completed job from the Scan Jobs tab to view its reconstructed OpenAPI specification.
      </div>
      <div id="spec-frame-wrap" class="hidden">
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm text-slate-300">Viewing spec for job <span id="spec-job-id" class="font-mono text-accent"></span></p>
        </div>
        <iframe id="spec-frame" class="w-full rounded-xl border border-edge bg-white" style="height: 78vh"></iframe>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
